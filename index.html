<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AoNuLL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 侧边菜单 -->
  <div class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <span>AoNuLL</span>
      <button class="side-close" onclick="closeMenu()">✕</button>
    </div>
    <div class="menu-item" onclick="openModal('about')">
      <span class="menu-icon">ℹ️</span><span>关于</span>
    </div>
    <div class="menu-item" onclick="openModal('group')">
      <span class="menu-icon">💬</span><span>交流群</span>
    </div>
    <div class="menu-item" onclick="openModal('profile')">
      <span class="menu-icon">👤</span><span>个人信息</span>
    </div>
  </div>

  <!-- 菜单遮罩 -->
  <div class="menu-mask" id="menuMask" onclick="closeMenu()"></div>

  <!-- 弹窗：关于 -->
  <div class="modal-mask" id="modalAbout">
    <div class="modal">
      <div class="modal-header">
        <span>关于</span>
        <button class="modal-close" onclick="closeAllModals()">✕</button>
      </div>
      <div class="modal-body">
        AoNuLL 的个人/项目展示页。这里可以写关于你的介绍，比如网站用途、你的背景。
      </div>
    </div>
  </div>

  <!-- 弹窗：交流群 -->
  <div class="modal-mask" id="modalGroup">
    <div class="modal">
      <div class="modal-header">
        <span>交流群</span>
        <button class="modal-close" onclick="closeAllModals()">✕</button>
      </div>
      <div class="modal-body">
        QQ群：123456789<br/>
        或：扫码/添加好友备注“进群”
      </div>
    </div>
  </div>

  <!-- 弹窗：个人信息 -->
  <div class="modal-mask" id="modalProfile">
    <div class="modal">
      <div class="modal-header">
        <span>个人信息</span>
        <button class="modal-close" onclick="closeAllModals()">✕</button>
      </div>
      <div class="modal-body">
        昵称：AoNuLL<br/>
        邮箱：your@email.com<br/>
        简介：全栈开发者，热爱开源。
      </div>
    </div>
  </div>

  <header class="nav">
    <button class="menu" onclick="openMenu()">☰</button>
    <div class="brand">
      <span class="brand-icon">A</span>
      <span class="brand-name">AoNuLL</span>
    </div>
    <button class="search">🔍</button>
  </header>

  <section class="slider">
    <div class="slides">
      <img class="slide active" src="images/slide1.jpg" alt="slide1">
    </div>
    <div class="dots">
      <span class="dot active"></span>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <div class="num">12</div>
      <div class="label">年开发经验</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">6</div>
      <div class="label">人开发团队</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">96</div>
      <div class="label">个成功项目</div>
    </div>
  </section>

  <main class="content">
    <h1 class="title">你的标题</h1>
    <p class="desc">介绍文字写在这里</p>
  </main>

  <script>
    function openMenu() {
      document.getElementById('sideMenu').classList.add('show');
      document.getElementById('menuMask').classList.add('show');
    }

    function closeMenu() {
      document.getElementById('sideMenu').classList.remove('show');
      document.getElementById('menuMask').classList.remove('show');
    }

    function openModal(name) {
      closeMenu();
      if (name === 'about') document.getElementById('modalAbout').classList.add('show');
      if (name === 'group') document.getElementById('modalGroup').classList.add('show');
      if (name === 'profile') document.getElementById('modalProfile').classList.add('show');
    }

    function closeAllModals() {
      document.getElementById('modalAbout').classList.remove('show');
      document.getElementById('modalGroup').classList.remove('show');
      document.getElementById('modalProfile').classList.remove('show');
    }
  </script>

</body>
</html>
