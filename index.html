<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AoNuLL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <button class="menu" aria-label="菜单">☰</button>
    <div class="brand">AoNuLL</div>
    <button class="search" aria-label="搜索">🔍</button>
  </header>

  <main class="page">

    <section class="hero">
      <img class="hero-img" src="images/slide1.jpg" alt="AoNuLL" />
      <button class="cta">立即定制</button>
    </section>

    <section class="service-intro">
      <h1 class="section-title">定制软件服务</h1>
      <p class="section-desc">
        不限于以上服务更多需求，请联系我们，专业团队为您服务
      </p>
    </section>

    <section class="services">

      <div class="service-item">
        <div class="service-icon icon-crm">CRM</div>
        <div class="service-text">
          <h2>CRM系统</h2>
          <p>CRM系统功能：客户资源管理、财务管理、项目管理、合同管理、供应链功能行政OA。</p>
        </div>
      </div>

      <div class="service-item">
        <div class="service-icon icon-erp">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 4a9 9 0 1 0-3.2 6.9l1.5 1.5a1 1 0 0 0 1.4-1.4l-1.5-1.5A9 9 0 0 0 21 12Z"/>
          </svg>
        </div>
        <div class="service-text">
          <h2>ERP系统</h2>
          <p>ERP系统主要功能有：客情管理客户资源管理、项目管理、财务管理行政OA等功能。</p>
        </div>
      </div>

      <div class="service-item">
        <div class="service-icon icon-shop">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M12 3 4 8v6c0 5 3.5 8 8 8s8-3 8-8V8l-8-5Zm0 2.2L18 9v5c0 4-2.8 6.5-6 6.5S6 18 6 14V9l6-3.8Z"/>
          </svg>
        </div>
        <div class="service-text">
          <h2>商城分销</h2>
          <p>商城分销系统功能：商品管理、商品入驻商品管理、三级分销、积分营销、一键分享等功能。</p>
        </div>
      </div>

    </section>

    <section class="resource">
      <div class="resource-card">
        <img src="images/slide2.jpg" alt="资源图" />
      </div>
      <div class="resource-title">
        <span class="blue-bar"></span> 资源下载
      </div>
      <div class="empty">没有添加文件</div>
    </section>

    <section class="empty-product">
      没有选择产品
    </section>

    <footer class="footer">
      <p>©2026 版权所有</p>
      <p class="support">AoNuLL 提供技术支持 | 举报</p>
    </footer>

  </main>

  <nav class="bottom-nav">
    <a href="#" class="active">
      <span>🏠</span>
      <small>关于我们</small>
    </a>
    <a href="#">
      <span>🛠</span>
      <small>解决方案</small>
    </a>
    <a href="#">
      <span>📰</span>
      <small>新闻动态</small>
    </a>
  </nav>

</body>
</html>
