<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AoNuLL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 顶部导航 -->
  <header class="nav">
    <button class="menu" aria-label="菜单">☰</button>
    <div class="brand">
      <span class="brand-icon">A</span>
      <span class="brand-name">AoNuLL</span>
    </div>
    <button class="search" aria-label="搜索">🔍</button>
  </header>

  <!-- 轮播图 -->
  <section class="slider">
    <div class="slides">
      <img class="slide active" src="images/slide1.jpg" alt="slide1">
      <!-- 以后有第二张图再取消注释下面这行 -->
      <!-- <img class="slide" src="images/slide2.jpg" alt="slide2"> -->
    </div>
    <div class="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>
  </section>

  <!-- 蓝色数据卡片 -->
  <section class="stats">
    <div class="stat">
      <div class="num">12</div>
      <div class="label">年开发经验</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">6</div>
      <div class="label">人开发团队</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">96</div>
      <div class="label">个成功项目</div>
    </div>
  </section>

  <!-- 正文内容 -->
  <main class="content">
    <h1 class="title">你的标题</h1>
    <p class="desc">你的介绍文字写在这里</p>
  </main>

</body>
</html>
