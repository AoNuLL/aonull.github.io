<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AoNuLL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 测试：这张图应该无条件显示 -->
  <img src="images/slide1.jpg" alt="test" style="width:100%;max-width:400px;display:block;margin:20px auto;border:3px solid red;">

  <header class="nav">
    <button class="menu">☰</button>
    <div class="brand">
      <span class="brand-icon">A</span>
      <span class="brand-name">AoNuLL</span>
    </div>
    <button class="search">🔍</button>
  </header>

  <section class="slider">
    <img class="slide active" src="images/slide1.jpg" alt="slide1">
  </section>

  <section class="stats">
    <div class="stat">
      <div class="num">12</div>
      <div class="label">年开发经验</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">6</div>
      <div class="label">人开发团队</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">96</div>
      <div class="label">个成功项目</div>
    </div>
  </section>

  <main class="content">
    <h1 class="title">你的标题</h1>
    <p class="desc">你的介绍文字</p>
  </main>

</body>
</html>
