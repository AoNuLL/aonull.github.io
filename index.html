<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AoNuLL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 侧边菜单遮罩 -->
  <div class="menu-mask" id="menuMask"></div>

  <!-- 侧边菜单 -->
  <nav class="side-menu" id="sideMenu">
    <div class="menu-header">
      <span class="menu-title">菜单</span>
      <button class="menu-close" id="menuClose">✕</button>
    </div>
    <div class="menu-user">
      <div class="menu-avatar">A</div>
      <div class="menu-username">AoNuLL</div>
    </div>
    <ul class="menu-list">
      <li class="menu-item" onclick="openPage('about')">
        <span class="menu-icon">📄</span>
        <span>关于</span>
      </li>
      <li class="menu-item" onclick="openPage('group')">
        <span class="menu-icon">💬</span>
        <span>交流群</span>
      </li>
      <li class="menu-item" onclick="openPage('profile')">
        <span class="menu-icon">👤</span>
        <span>个人信息</span>
      </li>
    </ul>
  </nav>

  <!-- 顶部导航 -->
  <header class="nav">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="brand">
      <span class="brand-icon">A</span>
      <span class="brand-name">AoNuLL</span>
    </div>
    <button class="search-btn">🔍</button>
  </header>

  <!-- 轮播图 -->
  <section class="slider">
    <div class="slides">
      <img class="slide active" src="images/slide1.jpg" alt="slide1">
    </div>
    <div class="dots">
      <span class="dot active"></span>
    </div>
  </section>

  <!-- 蓝色数据卡片 -->
  <section class="stats">
    <div class="stat">
      <div class="num">12</div>
      <div class="label">年开发经验</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">6</div>
      <div class="label">人开发团队</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="num">96</div>
      <div class="label">个成功项目</div>
    </div>
  </section>

  <!-- 正文内容 -->
  <main class="content">
    <h1 class="title">你的标题</h1>
    <p class="desc">你的介绍文字写在这里</p>
  </main>

  <!-- 弹窗：关于 -->
  <div class="modal-mask" id="modalAbout">
    <div class="modal">
      <div class="modal-header">
        <span>关于</span>
        <button class="modal-close" onclick="closeModal('modalAbout')">✕</button>
      </div>
      <div class="modal-body">
        <p>这里写关于你的介绍，比如网站用途、你的背景等。</p>
      </div>
    </div>
  </div>

  <!-- 弹窗：交流群 -->
  <div class="modal-mask" id="modalGroup">
    <div class="modal">
      <div class="modal-header">
        <span>交流群</span>
        <button class="modal-close" onclick="closeModal('modalGroup')">✕</button>
      </div>
      <div class="modal-body">
        <p>QQ群：123456789</p>
        <p>微信群：扫码添加好友备注"进群"</p>
      </div>
    </div>
  </div>

  <!-- 弹窗：个人信息 -->
  <div class="modal-mask" id="modalProfile">
    <div class="modal">
      <div class="modal-header">
        <span>个人信息</span>
        <button class="modal-close" onclick="closeModal('modalProfile')">✕</button>
      </div>
      <div class="modal-body">
        <p>昵称：AoNuLL</p>
        <p>邮箱：your@email.com</p>
        <p>简介：全栈开发者，热爱开源</p>
      </div>
    </div>
  </div>

  <script>
    // 菜单开关
    const sideMenu = document.getElementById('sideMenu');
    const menuMask = document.getElementById('menuMask');

    document.getElementById('menuBtn').onclick = () => {
      sideMenu.classList.add('open');
      menuMask.classList.add('show');
    };

    document.getElementById('menuClose').onclick = closeMenu;
    menuMask.onclick = closeMenu;

    function closeMenu() {
      sideMenu.classList.remove('open');
      menuMask.classList.remove('show');
    }

    // 弹窗
    function openPage(page) {
      closeMenu();
      const map = {
        'about': 'modalAbout',
        'group': 'modalGroup',
        'profile': 'modalProfile'
      };
      document.getElementById(map[page]).classList.add('show');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }
  </script>
</body>
</html>
