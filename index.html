<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AoNuLL · Personal Site</title>
  <meta name="description" content="AoNuLL 的个人主页">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <button class="menu-toggle" id="menuToggle" aria-label="菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">AoNuLL</div>
    <nav class="menu" id="menu">
      <a href="#home">首页</a>
      <a href="#works">作品</a>
      <a href="#about">关于</a>
      <a href="#contact">联系</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="side-menu">
        <a href="#home" class="active">首页</a>
        <a href="#works">作品展示</a>
        <a href="#about">关于我</a>
        <a href="#contact">联系我</a>
      </nav>
    </aside>

    <main class="content">
      <section id="home" class="hero">
        <div class="hero-inner">
          <p class="tag">PERSONAL SITE</p>
          <h1>你好，我是 AoNuLL</h1>
          <p class="sub">记录灵感、作品与成长的空间，欢迎来到这里。</p>
          <a href="#works" class="btn">浏览作品</a>
        </div>
      </section>

      <section id="works" class="section">
        <h2>作品展示</h2>
        <div class="grid">
          <figure class="card">
            <div class="card-media">
              <img src="images/slide1.jpg" alt="作品 1">
            </div>
            <figcaption>
              <h3>作品 1</h3>
              <p>作品 1 的简要描述，可以补充在这里。</p>
            </figcaption>
          </figure>
          <figure class="card">
            <div class="card-media">
              <img src="images/slide2.jpg" alt="作品 2">
            </div>
            <figcaption>
              <h3>作品 2</h3>
              <p>作品 2 的简要描述，可以补充在这里。</p>
            </figcaption>
          </figure>
        </div>
      </section>

      <section id="about" class="section">
        <h2>关于我</h2>
        <p>这里可以介绍你的背景、兴趣与正在做的事。深色简洁的个人主页，适合展示作品与想法。</p>
      </section>

      <section id="contact" class="section">
        <h2>联系我</h2>
        <p>你可以通过 GitHub 主页找到我。</p>
      </section>
    </main>
  </div>

  <footer class="footer">
    <p>© 2026 AoNuLL · Built with plain HTML &amp; CSS</p>
  </footer>

  <div class="overlay" id="overlay"></div>

  <script>
    const toggle = document.getElementById('menuToggle');
    const menu = document.getElementById('menu');
    const overlay = document.getElementById('overlay');

    function closeMenu() {
      menu.classList.remove('open');
      overlay.classList.remove('show');
      toggle.setAttribute('aria-expanded', 'false');
    }

    toggle.addEventListener('click', () => {
      const isOpen = menu.classList.toggle('open');
      overlay.classList.toggle('show', isOpen);
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    overlay.addEventListener('click', closeMenu);
    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
  </script>
</body>
</html>
