<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AoNuLL · Personal Site</title>
  <meta name="description" content="AoNuLL 的个人主页">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="brand">AoNuLL</div>
    <nav class="menu">
      <a href="#home">首页</a>
      <a href="#gallery">画廊</a>
      <a href="#about">关于</a>
      <a href="#contact">联系</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="hero-inner">
        <h1>欢迎来到 AoNuLL 的主页</h1>
        <p>记录灵感、作品与成长的空间</p>
        <a href="#gallery" class="btn">浏览作品</a>
      </div>
    </section>

    <section id="gallery" class="section">
      <h2>作品展示</h2>
      <div class="grid">
        <figure class="card">
          <img src="images/slide1.jpg" alt="作品 1">
          <figcaption>作品 1</figcaption>
        </figure>
        <figure class="card">
          <img src="images/slide2.jpg" alt="作品 2">
          <figcaption>作品 2</figcaption>
        </figure>
      </div>
    </section>

    <section id="about" class="section alt">
      <h2>关于我</h2>
      <p>这里可以介绍你的背景、兴趣与正在做的事。</p>
    </section>

    <section id="contact" class="section">
      <h2>联系我</h2>
      <p>你可以通过 GitHub 主页找到我。</p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 AoNuLL · Built with plain HTML &amp; CSS</p>
  </footer>
</body>
</html>
